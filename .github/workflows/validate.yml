name: Validate catalog

# The catalog's own contract, on every push and pull request: registry.json
# matches the manifests, and every entry passes the schema the platform
# installs against (mcps/manifest.schema.json of OtoDock/oto-dock, fetched at
# the latest release and checked against its sha256: its id names the release,
# so the two values move together after every publish, and the platform's
# release gate reports a pin that lags). This file lives in the PREP repo and
# is synced to the public catalog by dev/publish-catalog.sh.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  SCHEMA_URL: https://raw.githubusercontent.com/OtoDock/oto-dock/v1.8.1/mcps/manifest.schema.json
  SCHEMA_SHA256: 55efa94c3ce67e122bec76f926cbde5ca6168268a6b27722c191c9687e8b6ebd

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: The platform's manifest schema
        run: |
          curl -fsSLo "$RUNNER_TEMP/manifest.schema.json" "$SCHEMA_URL"
          echo "$SCHEMA_SHA256  $RUNNER_TEMP/manifest.schema.json" | sha256sum -c -
          echo "OTODOCK_MANIFEST_SCHEMA=$RUNNER_TEMP/manifest.schema.json" >> "$GITHUB_ENV"
      - name: Every manifest follows the schema
        run: |
          python3 -m pip install -q "jsonschema==4.26.0"
          python3 - <<'PY'
          import json, os, pathlib, sys
          from jsonschema import Draft202012Validator
          schema = json.loads(pathlib.Path(os.environ["OTODOCK_MANIFEST_SCHEMA"]).read_text(encoding="utf-8"))
          validator = Draft202012Validator(schema)
          bad = 0
          for path in sorted(pathlib.Path(".").glob("*/manifest.json")):
              for e in sorted(validator.iter_errors(json.loads(path.read_text(encoding="utf-8"))), key=lambda e: list(e.absolute_path)):
                  where = "/" + "/".join(str(p) for p in e.absolute_path)
                  print(f"::error file={path}::{where}: {e.message[:300]}")
                  bad += 1
          print(f"{bad} schema error(s)")
          sys.exit(1 if bad else 0)
          PY
      - name: Registry is current and every manifest validates
        # Against the base as well: a git+ entry whose pinned commit moved
        # must move its version (an install reads the version as the release).
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then base="origin/$BASE_REF"; else base="$BEFORE"; fi
          if [ -n "$base" ] && git rev-parse -q --verify "$base^{commit}" >/dev/null; then
            python3 scripts/generate-registry.py --check --against "$base"
          else
            python3 scripts/generate-registry.py --check
          fi
      - name: No install-time rejects
        run: |
          # The two things the installer rejects outright: a committed .env
          # and a manifest that asks for the platform's master key.
          set -e
          bad=0
          for f in $(git ls-files '*/.env' '*/**/.env'); do echo "::error::$f must not be committed"; bad=1; done
          if grep -rlE '\$\{(platform\.api_key|proxy_api_key)\}' --include=manifest.json . ; then
            echo "::error::a manifest references the master key"; bad=1
          fi
          exit $bad
