name: Validate catalog

# The catalog's own contract, on every push and pull request: registry.json
# matches the manifests, and every entry passes the schema the platform
# installs against. This file lives in the PREP repo and is synced to the
# public catalog by dev/publish-catalog.sh.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Registry is current and every manifest validates
        # Against the base as well: a git+ entry whose pinned commit moved
        # must move its version (an install reads the version as the release).
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then base="origin/$BASE_REF"; else base="$BEFORE"; fi
          if [ -n "$base" ] && git rev-parse -q --verify "$base^{commit}" >/dev/null; then
            python3 scripts/generate-registry.py --check --against "$base"
          else
            python3 scripts/generate-registry.py --check
          fi
      - name: No install-time rejects
        run: |
          # The two things the installer rejects outright: a committed .env
          # and a manifest that asks for the platform's master key.
          set -e
          bad=0
          for f in $(git ls-files '*/.env' '*/**/.env'); do echo "::error::$f must not be committed"; bad=1; done
          if grep -rlE '\$\{(platform\.api_key|proxy_api_key)\}' --include=manifest.json . ; then
            echo "::error::a manifest references the master key"; bad=1
          fi
          exit $bad
